name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: SlideCapture-Windows
          path: build/Release/*.dll

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Sign (ad-hoc) and zip
        run: |
          cd build
          codesign --force --deep -s - SCScreenCapture.bundle SCPresentation.bundle
          ditto -c -k --keepParent SCScreenCapture.bundle SCScreenCapture.zip
          ditto -c -k --keepParent SCPresentation.bundle SCPresentation.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SlideCapture-macOS
          path: build/*.zip

  linux-smoke-test:
    # Linux is not a Resolume platform; this only checks the shared code and plugin logic.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libglew-dev libegl-dev libgl-dev libegl1 libgl1-mesa-dri
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSC_BUILD_TESTS=ON && cmake --build build --parallel
      - name: Smoke test
        run: ./build/ffgl_host_smoke build/SCScreenCapture.so build/SCPresentation.so
